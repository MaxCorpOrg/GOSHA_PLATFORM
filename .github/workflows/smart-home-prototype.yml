name: Smart home isolated prototype
on:
  pull_request:
    paths:
      - 'smart_home/**'
      - '.github/workflows/smart-home-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest smart_home.test_core -v
