name: repo-validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-validation:
    name: repo-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository validation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash bin/ci_validate.sh
