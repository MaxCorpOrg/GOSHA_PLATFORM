name: repo-validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - converted_to_draft
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-validation:
    name: repo-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run repository validation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash bin/ci_validate.sh
